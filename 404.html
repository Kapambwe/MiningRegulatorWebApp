<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect all 404 routes to index.html and preserve path/query
      var path = location.pathname.replace('/MiningRegulatorWebApp', '');
      var search = location.search;
      if (path && path !== '/index.html' && path !== '/') {
        search = (search ? search + '&' : '?') + 'path=' + encodeURIComponent(path);
      }
      var redirectTo = '/MiningRegulatorWebApp/index.html' + search + location.hash;
      window.location.replace(redirectTo);
    </script>

</head>
<body>
</body>
</html>
